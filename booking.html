<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>احجز الآن | AZ14</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <span class="logo-icon">⚽</span>
                AZ14
            </a>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link">الرئيسية</a>
                <a href="booking.html" class="nav-link active">احجز الآن</a>
                <a href="my-bookings.html" class="nav-link">حجزي</a>
            </nav>
        </div>
    </header>

    <!-- Booking Section -->
    <section class="section" style="padding-top: 40px;">
        <div class="container">
            <h2 class="section-title">احجز ملعبك</h2>
            <p class="section-subtitle">اختار اليوم والوقت والمدة — والسعر هيتحسب تلقائيًا</p>

            <div class="glass-card" style="padding: 40px 30px; max-width: 600px; margin: 0 auto;">
                
                <!-- التاريخ -->
                <div class="form-group">
                    <label class="form-label">📅 اختر التاريخ</label>
                    <input type="date" id="bookingDate" class="form-input">
                </div>

                <!-- المواعيد المتاحة -->
                <div class="form-group">
                    <label class="form-label">🕐 اختر وقت البداية</label>
                    <div id="slotsContainer" class="slots-grid">
                        <!-- بتتحمل من Supabase -->
                    </div>
                </div>

                <!-- المدة -->
                <div class="form-group">
                    <label class="form-label">⏱️ مدة الحجز</label>
                    <select id="duration" class="form-input">
                        <option value="60">60 دقيقة</option>
                        <option value="90">90 دقيقة</option>
                        <option value="120">120 دقيقة</option>
                    </select>
                </div>

                <!-- نوع الحجز -->
                <div class="form-group">
                    <label class="form-label">📋 نوع الحجز</label>
                    <select id="bookingType" class="form-input">
                        <option value="normal">حجز عادي</option>
                        <option value="weekly">حجز أسبوعي ثابت</option>
                    </select>
                </div>

                <!-- رقم الموبايل -->
                <div class="form-group">
                    <label class="form-label">📱 رقم الموبايل</label>
                    <input type="tel" id="phone" class="form-input" placeholder="01xxxxxxxxx" pattern="01[0-9]{9}">
                </div>

                <!-- ملخص السعر -->
                <div class="glass-card" style="padding: 25px; margin-bottom: 25px; text-align: center; background: rgba(34,197,94,0.05);">
                    <p style="color: #94A3B8; margin-bottom: 10px;">السعر الإجمالي</p>
                    <p id="totalPrice" style="font-size: 40px; font-weight: 900; color: #22C55E;">0 ج.م</p>
                </div>

                <!-- زر الحجز -->
                <button id="confirmBooking" class="btn-primary btn-block">تأكيد الحجز</button>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
